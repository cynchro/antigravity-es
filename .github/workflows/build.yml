name: Compilar Binarios Nativos

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Publicar Binarios
    runs-on: ubuntu-latest

    steps:
      - name: Compilar y Publicar Release Automáticamente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Instalar Go
          sudo apt-get update
          sudo apt-get install -y golang-go
          go version

          # 2. Clonar el repositorio en una carpeta temporal
          git clone https://github.com/cynchro/antigravity-es.git src_repo
          cd src_repo

          # 3. Inicializar módulo y compilar
          mkdir -p dist
          go mod init antigravity-es || true

          echo "Compilando para Linux..."
          GOOS=linux GOARCH=amd64 go build -o dist/antigravity-es-linux

          echo "Compilando para Windows..."
          GOOS=windows GOARCH=amd64 go build -o dist/antigravity-es-windows.exe

          echo "Compilando para macOS..."
          GOOS=darwin GOARCH=arm64 go build -o dist/antigravity-es-macos

          # 4. Crear el Release directamente usando el repositorio explícito
          TAG="v1.0.$(date +%Y%m%d%H%M%S)"
          echo "Publicando Release $TAG..."
          
          gh release create "$TAG" dist/* \
            --repo cynchro/antigravity-es \
            --title "Antigravity ES $TAG" \
            --notes "Binarios compilados automáticamente en español sin dependencias externas." \
            --latest
