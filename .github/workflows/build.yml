name: Compilar Binarios Nativos

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Publicar Binarios
    runs-on: ubuntu-latest

    steps:
      - name: 1. Instalar Go
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          go version

      - name: 2. Inicializar Módulo y Compilar Binarios
        run: |
          mkdir -p dist
          
          # Inicializar el módulo de Go si no existe
          go mod init antigravity-es || true
          
          echo "Compilando para Linux..."
          GOOS=linux GOARCH=amd64 go build -o dist/antigravity-es-linux
          
          echo "Compilando para Windows..."
          GOOS=windows GOARCH=amd64 go build -o dist/antigravity-es-windows.exe
          
          echo "Compilando para macOS..."
          GOOS=darwin GOARCH=arm64 go build -o dist/antigravity-es-macos
          
          ls -la dist/

      - name: 3. Publicar Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%Y%m%d%H%M%S)"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          gh release create "$TAG" dist/* \
            --title "Antigravity ES $TAG" \
            --notes "Binarios compilados automáticamente en español sin dependencias externas." \
            --latest
