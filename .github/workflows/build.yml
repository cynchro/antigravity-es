name: Compilar Binarios Nativos

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write # Necesario para crear el Release automáticamente

jobs:
  build:
    name: Compilar y Publicar Binarios
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio y preparar entorno
        run: |
          # Clonar el repositorio actual de forma limpia
          git clone https://github.com/cynchro/antigravity-es.git .
          
          # Instalar Go de forma nativa en el servidor de ejecución
          sudo apt-get update && sudo apt-get install -y golang-go
          go version

      - name: Compilar para Linux, Windows y macOS
        run: |
          mkdir -p dist
          
          echo "Compilando para Linux..."
          GOOS=linux GOARCH=amd64 go build -o dist/antigravity-es-linux main.go
          
          echo "Compilando para Windows..."
          GOOS=windows GOARCH=amd64 go build -o dist/antigravity-es-windows.exe main.go
          
          echo "Compilando para macOS..."
          GOOS=darwin GOARCH=arm64 go build -o dist/antigravity-es-macos main.go
          
          ls -la dist/

      - name: Publicar Release Automático con los Binarios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%Y%m%d%H%M%S)"
          
          # Crear un Release en GitHub y subir los ejecutables directamente usando la CLI integrada (gh)
          gh release create "$TAG" dist/* \
            --title "Antigravity ES $TAG" \
            --notes "Binarios compilados automáticamente en español sin dependencias externas."
