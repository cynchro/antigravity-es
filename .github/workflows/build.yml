name: Compilar Binarios Nativos

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Publicar Binarios
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Go
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          go version

      - name: Compilar para Linux, Windows y macOS
        run: |
          mkdir -p dist
          
          echo "Compilando para Linux..."
          GOOS=linux GOARCH=amd64 go build -o dist/antigravity-es-linux main.go
          
          echo "Compilando para Windows..."
          GOOS=windows GOARCH=amd64 go build -o dist/antigravity-es-windows.exe main.go
          
          echo "Compilando para macOS..."
          GOOS=darwin GOARCH=arm64 go build -o dist/antigravity-es-macos main.go
          
          ls -la dist/

      - name: Publicar Release Automático con los Binarios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%Y%m%d%H%M%S)"
          
          gh release create "$TAG" dist/* \
            --title "Antigravity ES $TAG" \
            --notes "Binarios compilados automáticamente en español sin dependencias externas."
