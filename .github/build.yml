name: Compilar Binarios Nativos

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            output: antigravity-es-linux
          - os: windows
            goos: windows
            goarch: amd64
            output: antigravity-es-windows.exe
          - os: macos
            goos: darwin
            goarch: arm64
            output: antigravity-es-macos

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Go en la nube
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compilar binario
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.output }} main.go

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
